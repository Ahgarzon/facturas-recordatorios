name: control-facturas

x-n8n: &n8n
  image: n8nio/n8n:2.49.7
  environment: &n8n-env
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?define N8N_ENCRYPTION_KEY in .env}
    N8N_HOST: ${N8N_HOST:-localhost}
    N8N_PORT: 5678
    N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
    N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
    N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:15678}
    N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_PUBLIC_API_DISABLED: "true"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_TEMPLATES_ENABLED: "false"
    DB_SQLITE_POOL_SIZE: "2"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    GENERIC_TIMEZONE: America/Bogota
    TZ: America/Bogota
  networks: [default, data]

services:
  mongo:
    image: mongo:8.0.38
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: demo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?define MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: facturas
      MONGO_API_PASSWORD: ${MONGO_API_PASSWORD:?define MONGO_API_PASSWORD in .env}
      MONGO_N8N_PASSWORD: ${MONGO_N8N_PASSWORD:?define MONGO_N8N_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-users.js:ro
    networks: [data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host mongo --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/messages.db
    volumes:
      - mail-data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"

  api:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Mongo__ConnectionString: mongodb://facturas_api:${MONGO_API_PASSWORD}@mongo:27017/facturas?authSource=facturas
      Mongo__Database: facturas
      Workflow__Key: ${WORKFLOW_KEY:?define WORKFLOW_KEY in .env}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Demo__Seed: "true"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks: [default, data]
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"

  n8n:
    <<: *n8n
    restart: unless-stopped
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-15678}:5678"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  n8n-setup:
    <<: *n8n
    profiles: [setup]
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *n8n-env
      MONGO_N8N_PASSWORD: ${MONGO_N8N_PASSWORD}
      WORKFLOW_KEY: ${WORKFLOW_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./docker/bootstrap-n8n.mjs:/setup/bootstrap.mjs:ro
      - ./n8n/recordatorios.json:/setup/recordatorios.json:ro
    tmpfs:
      - /tmp:mode=1777
    entrypoint: ["node", "/setup/bootstrap.mjs"]

networks:
  data:
    internal: true

volumes:
  mongo-data:
  mail-data:
  n8n-data:
